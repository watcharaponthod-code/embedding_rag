apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: webclient-document-upload

# Namespace for all resources
namespace: default

# Common labels applied to all resources
commonLabels:
  app: webclient-document-upload
  managed-by: kustomize

# Resources to include
resources:
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  # Uncomment to include PVC
  # - pvc.yaml
  # Uncomment to include Ingress
  # - ingress.yaml

# Images to patch (useful for updating image tags without modifying files)
images:
  - name: your-registry/webclient-document-upload
    newName: your-registry/webclient-document-upload
    newTag: latest

# ConfigMap generator (alternative to configmap.yaml)
# Uncomment to generate ConfigMap from literals or files
# configMapGenerator:
#   - name: app-config
#     literals:
#       - PORT=3001
#       - OLLAMA_HOST=http://10.0.2.191:11434

# Secret generator (alternative to secret.yaml)
# Uncomment to generate Secret from literals or files
# secretGenerator:
