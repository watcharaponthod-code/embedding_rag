apiVersion: v1
kind: Service
metadata:
  name: webclient-chat-service
  labels:
    app: webclient-chat
spec:
  type: NodePort
  selector:
    app: webclient-chat
    tier: backend
  ports:
  - port: 3001
    targetPort: 3001
    nodePort: 32001
    protocol: TCP
    name: http
  sessionAffinity: None

---
