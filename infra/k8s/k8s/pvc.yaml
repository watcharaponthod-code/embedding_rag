apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: document-uploads-pvc
  labels:
    app: webclient-document-upload
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: standard  # Uncomment and specify your storage class if needed
  # For cloud providers, examples:
  # - GKE: "standard" or "ssd"
  # - EKS: "gp2" or "gp3"
  # - AKS: "default" or "managed-premium"
